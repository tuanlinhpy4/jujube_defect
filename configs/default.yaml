# MvANet default experiment config.
#
# Defaults follow the reported paper setup where values are available:
# - MvANet-3, 32x32 input
# - mini-batch size 64
# - 1,280 validation images held out from train/ when val/ is absent
# - SGD + momentum 0.9, initial LR 0.1
# - LR multiplied by 0.1 at 40%, 70%, and 90% of 300 epochs
#
# The paper does not publish dataset mean/std or weight decay. For that reason
# normalization defaults to ToTensor() only ([0, 1] pixels), and weight_decay=0.

model:
  arch: "MvANet"
  name: "mvanet_3"
  num_classes: 4
  in_channels: 3

data:
  root: "./dataset"
  input_size: 32
  batch_size_train: 64
  batch_size_eval: 5
  val_size: 1280
  num_workers: 2
  pin_memory: null          # null = auto: true on CUDA, false on CPU
  drop_last_train: false    # keep every sample for reproducible class counts
  normalize_mean: null      # set explicit dataset mean here if used
  normalize_std: null       # set explicit dataset std here if used
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: 15
    color_jitter: 0.0       # not reported in the paper; keep off by default

train:
  epochs: 300
  optimizer: "sgd"
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0

  lr_scheduler: "step"
  step_milestones: [120, 210, 270]
  step_gamma: 0.1

  plateau_mode: "min"
  plateau_factor: 0.5
  plateau_patience: 15
  plateau_min_lr: 1.0e-5
  cosine_T_max: 300
  cosine_eta_min: 1.0e-5

  use_class_weights: false
  seed_mode: "single"       # single=[42], five=[42,123,456,789,2024]
  seeds: null               # optional explicit seed list, e.g. [42, 123]
  num_runs: 1               # use range/custom for counts other than 1 or 5
  seed: 42
  deterministic: true

  save_dir: "./runs"
  save_every: 50
  resume: null

eval:
  checkpoint: null
  output_dir: null
  visualize: true

export:
  checkpoint: null
  output: null
  opset_version: 18
  dynamic_batch: true
  simplify: false
  verify: false
