# Fast CPU smoke test config.
#
# Use this only to verify that the pipeline runs end-to-end on a tiny dataset.
# It is intentionally not the paper setting.

model:
  arch: "MvANet"
  name: "mvanet_1_tiny"
  num_classes: 4
  in_channels: 3

data:
  root: "./dataset"
  input_size: 32
  batch_size_train: 8
  batch_size_eval: 5
  val_size: 0.2
  num_workers: 0
  pin_memory: false
  drop_last_train: false
  normalize_mean: null
  normalize_std: null
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: 15
    color_jitter: 0.0

train:
  epochs: 1
  optimizer: "sgd"
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  lr_scheduler: "none"
  step_milestones: []
  step_gamma: 0.1
  plateau_mode: "min"
  plateau_factor: 0.5
  plateau_patience: 15
  plateau_min_lr: 1.0e-5
  cosine_T_max: 1
  cosine_eta_min: 1.0e-5
  use_class_weights: false
  seed_mode: "single"
  seeds: null
  num_runs: 1
  seed: 42
  deterministic: true
  save_dir: "./runs_smoke"
  save_every: 0
  resume: null

eval:
  checkpoint: null
  output_dir: null
  visualize: false

export:
  checkpoint: null
  output: null
  opset_version: 18
  dynamic_batch: true
  simplify: false
  verify: false
